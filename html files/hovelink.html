<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Link Hover</title>
    <style>
        /* Link Container */
        .btn-link {
            display: inline-flex;
            align-items: center;
            position: relative;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            overflow: hidden;
            transition: background 0.3s ease-in-out;
        }

        /* Background Hover Effect */
        .animated-link::before {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 2px;
            background: grey;
            transform-origin: left;
            transition: transform 0.3sease-in-out;
        }

        /* Progress Bar */
        .animated-link::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background: orange;
            transition: width 0.3s ease-in-out;
        }

        /* SVG Icon */
        .animated-link svg {
            margin-left: 10px;
            transition: transform 0.3s ease-in-out;
        }

        /* Hover Effects */
        .animated-link:hover::before {
            transform: scaleX(1);
        }

        .animated-link:hover::after {
            width: 100%;
        }
         /* SVG Common Style */
         .progressive-animation svg {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            display: inline-block;
        }

        /* Default Arrow */
        .default {
            opacity: 1;
            transform-origin: center;
        }

        /* Hover Effect: Sketch effect before disappearing */
        .animated-link:hover + .default {
            /* transform:  */
            opacity: 0;
            transform: scale(1.3) rotate(135deg);
            transition: transform 0.1s ease-in-out, opacity 0.1s ease-in-out;
        }

        /* Hidden New Arrow (Appears after delay) */
        .link-hover {
            opacity: 0;
            transform: translateY(-10px) translateX(-17px) rotate(310deg);
        }

        /* Show New Arrow on Hover */
        .animated-link:hover + .default + .link-hover {
            opacity: 1;
            transform: translateY(0) translateX(-17px) rotate(359deg);
            transition: opacity 0.1s ease-in-out 0.1s, transform 0.1s ease-in-out 0.1s;
        }
    </style>
</head>
<body>
    <div class="progressive-animation">
        <a href="#" class="btn-link animated-link">contact</a>
        <svg width="15" height="15" class="default" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M4.81778 0.490323L4.82294 1.97118L12.1508 1.99609L0.721175 13.4258L1.78184 14.4864L13.2101 3.05817L13.2364 10.3847L14.7173 10.3898L14.6879 2.00458L14.6953 2.00557L14.6902 0.524712L4.81778 0.490323Z" fill="#2B2829"/>
        </svg>
        <svg width="11" height="23" class="link-hover" viewBox="0 0 11 23" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5.5 1L5.5 21M5.5 21L10 16M5.5 21L1 16" stroke="#720D0D" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
    </div>
</body>
</html>
