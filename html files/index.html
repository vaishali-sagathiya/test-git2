<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
  
    <style>
        /* General link styling */
        .animated-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            font-size: 18px;
            text-decoration: none;
            color: black;
            overflow: hidden;
            background-color: transparent;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        /* Background effect */
        .animated-link::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: grey;
            transition: width 0.4s ease-in-out;
            z-index: -1;
        }

        /* Progress bar effect */
        .animated-link::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 4px;
            background: orange;
            transition: width 0.4s ease-in-out;
        }

        /* Hover effects */
        .animated-link:hover::before {
            width: 100%;
        }

        .animated-link:hover::after {
            width: 100%;
        }

        /* SVG icon */
        .animated-link svg {
            width: 20px;
            height: 20px;
            margin-left: 10px;
            transition: transform 0.3s ease;
        }

        /* Rotate SVG on hover */
        .animated-link:hover svg {
            transform: rotate(45deg);
        }
    </style>


    <a href="#" class="animated-link">

        </svg>
    </a>
